name: ssh
description: |
  Pure-shell ssh-agent setup + known_hosts + key add. No Node.js, no x-cmd needed.
  Extracted from x-cmd/action's init step so it can be used standalone.

inputs:
  key:
    description: SSH private key (PEM). If empty, ssh-agent still starts and known_hosts is loaded, but no key is added.
    required: false
  known-hosts-url:
    description: URL to fetch known_hosts from. Defaults to x-cmd/knownhost's public file.
    required: false
    default: 'https://raw.githubusercontent.com/x-cmd/knownhost/main/dist/all.txt'
  strict:
    description: 'Enable strict host key checking. Anything other than "true" disables it.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: ssh-agent + known_hosts + key
      shell: bash
      env:
        INPUT_KEY: ${{ inputs.key }}
        INPUT_KNOWN_HOSTS_URL: ${{ inputs.known-hosts-url }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: bash ${{ github.action_path }}/lib/ssh.sh