name: test-ssh
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ssh action with no key (agent + known_hosts only)
        uses: x-cmd-action/ssh@v1

      - name: verify agent is running
        shell: bash
        run: |
          ssh-add -l 2>&1 || echo "(no keys loaded, expected)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
          test -d ~/.ssh && echo "OK: ~/.ssh exists"
          test -f ~/.ssh/known_hosts && echo "OK: known_hosts present"

      - name: ssh action with key loaded
        uses: x-cmd-action/ssh@v1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: verify key is loaded
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          ssh-add -l
          echo "OK: key loaded"